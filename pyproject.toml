[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdkdebug"
version = "0.0.4"
description = "可被 AI 工具调用的 Keil uVision 调试服务（MCP Server）——UVSOCK 在线调试 + UV4 编译烧录闭环"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["keil", "uvision", "mcp", "uvsock", "debug", "stm32", "cortex-m"]
authors = [{ name = "mdkdebug" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.8",
    "pyelftools>=0.30",
    "capstone>=5.0",
]

[project.scripts]
mdkdebug = "mdkdebug.cli:main"

[tool.setuptools]
packages = ["mdkdebug"]

[tool.setuptools.package-data]
mdkdebug = ["py.typed"]
