[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdkdebug"
version = "0.2.0"
description = "可被 AI 工具调用的 Keil uVision 调试服务（MCP Server）——UVSOCK 在线调试 + UV4 编译烧录闭环"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["keil", "uvision", "mcp", "uvsock", "debug", "stm32", "cortex-m"]
authors = [{ name = "mdkdebug" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.8",
    "pyelftools>=0.30",
    "capstone>=5.0",
    # 代码结构索引层（可选能力：缺失时 code 组工具如实报 parser-missing，不降级成 grep）
    "tree-sitter>=0.26",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
]

[project.scripts]
mdkdebug = "mdkdebug.cli:main"

[tool.setuptools]
# 子包必须显式列出来（原来只有 mdkdebug，viz 与 codeindex 都不会被装进 wheel）：
# viz = 可视化渲染；codeindex = 代码结构索引（批次68）。
packages = ["mdkdebug", "mdkdebug.viz", "mdkdebug.codeindex"]

[tool.setuptools.package-data]
mdkdebug = ["py.typed"]
